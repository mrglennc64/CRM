<!doctype html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="../colors_and_type.css">
<style>
  body { margin:0; padding:24px; background:var(--cream); display:flex; gap:16px; }
  .card { background:#fff; border:1px solid var(--border); border-top:2px solid var(--gold); border-radius:12px; padding:22px; flex:1; box-shadow:0 4px 12px -2px rgba(120,53,15,0.18); }
  .eyebrow { font-family:var(--font-body); font-weight:600; font-size:11px; text-transform:uppercase; letter-spacing:0.12em; color:var(--amber); }
  .num { font-family:var(--font-display); font-weight:800; font-size:44px; color:var(--charcoal); letter-spacing:-0.02em; line-height:1; margin-top:6px; font-variation-settings:'opsz' 144; }
  .label { font-family:var(--font-body); font-size:13px; color:var(--fg2); margin-top:8px; line-height:1.5; }
  .dark { background:var(--charcoal); border:1px solid rgba(253,230,138,0.18); border-top:2px solid var(--gold); color:var(--cream); }
  .dark .num { color:var(--gold); }
  .dark .label { color:var(--fg2-on-dark); }
</style></head>
<body>
  <div class="card">
    <div class="eyebrow">Catalog Scan</div>
    <div class="num">$2,000</div>
    <div class="label">Recovered for a 12‑track artist</div>
  </div>
  <div class="card dark">
    <div class="eyebrow">Leakage</div>
    <div class="num">10–30%</div>
    <div class="label">Royalties lost in most catalogs</div>
  </div>
</body></html>
