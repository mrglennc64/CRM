<!doctype html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="../colors_and_type.css">
<style>
  body { margin:0; padding:24px; background:var(--cream); }
  .row { display:flex; gap:12px; flex-wrap:wrap; }
  .swatch { width:148px; }
  .chip { height:96px; border-radius:12px; box-shadow:var(--shadow-sm); border:1px solid var(--border); display:flex; align-items:flex-end; padding:10px; }
  .name { font-family:var(--font-body); font-weight:700; font-size:13px; color:var(--charcoal); margin-top:8px; }
  .hex  { font-family:var(--font-mono); font-size:11px; color:var(--fg2); margin-top:2px; }
  .role { font-family:var(--font-body); font-size:10px; text-transform:uppercase; letter-spacing:0.12em; color:var(--fg3); margin-top:2px; }
</style></head>
<body>
  <div class="row">
    <div class="swatch"><div class="chip" style="background:#D97706;"></div><div class="name">Amber</div><div class="hex">#D97706</div><div class="role">Primary</div></div>
    <div class="swatch"><div class="chip" style="background:#F59E0B;"></div><div class="name">Gold</div><div class="hex">#F59E0B</div><div class="role">Secondary</div></div>
    <div class="swatch"><div class="chip" style="background:#FDE68A;"></div><div class="name">Soft Yellow</div><div class="hex">#FDE68A</div><div class="role">Surface</div></div>
    <div class="swatch"><div class="chip" style="background:#78350F;"></div><div class="name">Deep Brown</div><div class="hex">#78350F</div><div class="role">Dark surface</div></div>
    <div class="swatch"><div class="chip" style="background:#1F2937;"></div><div class="name">Charcoal</div><div class="hex">#1F2937</div><div class="role">Text / base</div></div>
  </div>
</body></html>
