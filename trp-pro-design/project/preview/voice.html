<!doctype html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="../colors_and_type.css">
<style>
  body { margin:0; padding:24px; background:var(--cream); }
  .voice { display:grid; grid-template-columns: 1fr 1fr; gap:12px; }
  .col h4 { font-family:var(--font-body); font-size:11px; text-transform:uppercase; letter-spacing:0.12em; margin:0 0 10px; }
  .yes h4 { color:#15803D; }
  .no  h4 { color:#B91C1C; }
  .ex  { font-family:var(--font-display); font-weight:700; font-size:18px; line-height:1.3; color:var(--charcoal); padding:12px 14px; border-radius:8px; margin-bottom:8px; letter-spacing:-0.01em; }
  .yes .ex { background:#FEF3C7; border-left:3px solid #15803D; }
  .no  .ex { background:#FEF3C7; border-left:3px solid #B91C1C; color:var(--fg2); text-decoration:line-through; text-decoration-color:rgba(185,28,28,0.4); }
</style></head>
<body>
  <div class="voice">
    <div class="col yes">
      <h4>✓ On‑brand</h4>
      <div class="ex">12 tracks. $2,000 missing.</div>
      <div class="ex">You don't fix metadata. We fix it for you.</div>
    </div>
    <div class="col no">
      <h4>✗ Off‑brand</h4>
      <div class="ex">Maximize royalty potential 🚀</div>
      <div class="ex">Streamline your workflow today!</div>
    </div>
  </div>
</body></html>
