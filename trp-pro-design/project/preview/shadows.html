<!doctype html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="../colors_and_type.css">
<style>
  body { margin:0; padding:32px; background:var(--cream); }
  .row { display:flex; gap:24px; }
  .item { text-align:center; }
  .box { width:120px; height:80px; background:#fff; border-radius:12px; border:1px solid var(--border); display:flex; align-items:center; justify-content:center; font-family:var(--font-body); font-weight:700; font-size:12px; color:var(--charcoal); }
  .name { font-family:var(--font-body); font-weight:700; font-size:12px; color:var(--charcoal); margin-top:14px; }
  .v { font-family:var(--font-mono); font-size:10px; color:var(--fg2); margin-top:2px; max-width:120px; }
</style></head>
<body>
  <div class="row">
    <div class="item">
      <div class="box" style="box-shadow: 0 1px 2px rgba(120,53,15,0.10);">SM</div>
      <div class="name">Shadow SM</div><div class="v">subtle warm lift</div>
    </div>
    <div class="item">
      <div class="box" style="box-shadow: 0 4px 12px -2px rgba(120,53,15,0.18);">MD</div>
      <div class="name">Shadow MD</div><div class="v">cards, hover</div>
    </div>
    <div class="item">
      <div class="box" style="box-shadow: 0 8px 32px -8px rgba(120,53,15,0.25);">LG</div>
      <div class="name">Shadow LG</div><div class="v">popovers, sheets</div>
    </div>
    <div class="item">
      <div class="box" style="box-shadow: 0 24px 64px -16px rgba(120,53,15,0.35);">XL</div>
      <div class="name">Shadow XL</div><div class="v">modals, hero</div>
    </div>
    <div class="item">
      <div class="box" style="box-shadow: 0 0 0 1px rgba(245,158,11,0.4), 0 0 24px rgba(245,158,11,0.35);">GLOW</div>
      <div class="name">Glow</div><div class="v">CTA emphasis</div>
    </div>
  </div>
</body></html>
