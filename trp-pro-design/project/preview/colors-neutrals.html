<!doctype html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="../colors_and_type.css">
<style>
  body { margin:0; padding:24px; background:var(--cream); }
  .row { display:flex; gap:12px; flex-wrap:wrap; }
  .swatch { width:148px; }
  .chip { height:96px; border-radius:12px; box-shadow:var(--shadow-sm); border:1px solid var(--border); }
  .name { font-family:var(--font-body); font-weight:700; font-size:13px; color:var(--charcoal); margin-top:8px; }
  .hex  { font-family:var(--font-mono); font-size:11px; color:var(--fg2); margin-top:2px; }
  .role { font-family:var(--font-body); font-size:10px; text-transform:uppercase; letter-spacing:0.12em; color:var(--fg3); margin-top:2px; }
</style></head>
<body>
  <div class="row">
    <div class="swatch"><div class="chip" style="background:#FFFBEB;"></div><div class="name">Cream</div><div class="hex">#FFFBEB</div><div class="role">Light bg</div></div>
    <div class="swatch"><div class="chip" style="background:#FEF3C7;"></div><div class="name">Paper</div><div class="hex">#FEF3C7</div><div class="role">Light alt</div></div>
    <div class="swatch"><div class="chip" style="background:#451A03;"></div><div class="name">Brown 900</div><div class="hex">#451A03</div><div class="role">Deepest</div></div>
    <div class="swatch"><div class="chip" style="background:#374151;"></div><div class="name">Charcoal 700</div><div class="hex">#374151</div><div class="role">Dark alt</div></div>
    <div class="swatch"><div class="chip" style="background:#4B5563;"></div><div class="name">Fg Secondary</div><div class="hex">#4B5563</div><div class="role">Body 2</div></div>
  </div>
</body></html>
