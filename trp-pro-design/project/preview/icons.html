<!doctype html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="../colors_and_type.css">
<style>
  body { margin:0; padding:24px; background:var(--cream); }
  .grid { display:grid; grid-template-columns: repeat(7, 1fr); gap:14px; align-items:center; justify-items:center; }
  .icon { width:28px; height:28px; color:var(--charcoal); }
  .name { font-family:var(--font-body); font-size:10px; color:var(--fg3); margin-top:6px; text-align:center; }
  .item { display:flex; flex-direction:column; align-items:center; }
</style></head>
<body>
  <div class="grid">
    <div class="item"><img class="icon" src="https://unpkg.com/lucide-static@0.469.0/icons/scan-line.svg"/><div class="name">scan</div></div>
    <div class="item"><img class="icon" src="https://unpkg.com/lucide-static@0.469.0/icons/music.svg"/><div class="name">music</div></div>
    <div class="item"><img class="icon" src="https://unpkg.com/lucide-static@0.469.0/icons/file-music.svg"/><div class="name">work</div></div>
    <div class="item"><img class="icon" src="https://unpkg.com/lucide-static@0.469.0/icons/badge-check.svg"/><div class="name">verified</div></div>
    <div class="item"><img class="icon" src="https://unpkg.com/lucide-static@0.469.0/icons/dollar-sign.svg"/><div class="name">money</div></div>
    <div class="item"><img class="icon" src="https://unpkg.com/lucide-static@0.469.0/icons/trending-up.svg"/><div class="name">growth</div></div>
    <div class="item"><img class="icon" src="https://unpkg.com/lucide-static@0.469.0/icons/triangle-alert.svg"/><div class="name">leak</div></div>
    <div class="item"><img class="icon" src="https://unpkg.com/lucide-static@0.469.0/icons/shield-check.svg"/><div class="name">guarantee</div></div>
    <div class="item"><img class="icon" src="https://unpkg.com/lucide-static@0.469.0/icons/file-check.svg"/><div class="name">submit</div></div>
    <div class="item"><img class="icon" src="https://unpkg.com/lucide-static@0.469.0/icons/users.svg"/><div class="name">contributors</div></div>
    <div class="item"><img class="icon" src="https://unpkg.com/lucide-static@0.469.0/icons/percent.svg"/><div class="name">splits</div></div>
    <div class="item"><img class="icon" src="https://unpkg.com/lucide-static@0.469.0/icons/sparkles.svg"/><div class="name">clean</div></div>
    <div class="item"><img class="icon" src="https://unpkg.com/lucide-static@0.469.0/icons/arrow-right.svg"/><div class="name">go</div></div>
    <div class="item"><img class="icon" src="https://unpkg.com/lucide-static@0.469.0/icons/crown.svg"/><div class="name">royalty</div></div>
  </div>
</body></html>
