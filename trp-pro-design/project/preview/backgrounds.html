<!doctype html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="../colors_and_type.css">
<style>
  body { margin:0; padding:0; background:var(--cream); display:flex; gap:0; }
  .panel { flex:1; height:200px; padding:24px; display:flex; align-items:flex-end; }
  .label { font-family:var(--font-body); font-size:11px; text-transform:uppercase; letter-spacing:0.12em; color:rgba(255,251,235,0.7); }
  .solid { background:var(--charcoal); }
  .gradient { background: radial-gradient(120% 100% at 0% 100%, #F59E0B 0%, #D97706 30%, #78350F 70%, #1F2937 100%); }
  .grain { position:relative; background:var(--deep-brown); }
  .grain::after { content:""; position:absolute; inset:0; opacity:0.18; mix-blend-mode:overlay;
    background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='160' height='160'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='2' stitchTiles='stitch'/></filter><rect width='100%' height='100%' filter='url(%23n)' opacity='0.5'/></svg>"); }
  .grain .label { position:relative; z-index:1; color:rgba(253,230,138,0.85); }
</style></head>
<body>
  <div class="panel solid"><div class="label">Solid charcoal</div></div>
  <div class="panel gradient"><div class="label">Warm radial gradient</div></div>
  <div class="panel grain"><div class="label">Grain on brown</div></div>
</body></html>
