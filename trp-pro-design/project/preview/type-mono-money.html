<!doctype html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="../colors_and_type.css">
<style>
  body { margin:0; padding:28px; background:var(--cream); }
  .row { display:flex; gap:24px; align-items:center; }
  .lab { font-family:var(--font-body); font-size:11px; text-transform:uppercase; letter-spacing:0.12em; color:var(--fg3); width:110px; flex:none; }
  .mono { font-family:var(--font-mono); }
  .money-big { font-family:var(--font-display); font-weight:800; font-size:84px; line-height:0.9; color:var(--amber); letter-spacing:-0.03em; font-variation-settings:'opsz' 144; }
  .stack { display:flex; flex-direction:column; gap:14px; margin-top:14px; }
</style></head>
<body>
  <div class="row">
    <div class="lab">Money</div>
    <div>
      <div class="money-big">$52,400</div>
      <div style="font-family:var(--font-body); font-size:13px; color:var(--fg2); margin-top:4px;">Found in a North American catalog</div>
    </div>
  </div>
  <div class="stack">
    <div class="row"><div class="lab">Mono / 14</div><div class="mono" style="font-size:14px; color:var(--charcoal);">ISRC: USRC17607839</div></div>
    <div class="row"><div class="lab">Mono / 12</div><div class="mono" style="font-size:12px; color:var(--fg2);">ISWC: T-345.246.800-1 · IPI: 00378495712</div></div>
  </div>
</body></html>
