<!doctype html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="../colors_and_type.css">
<style>
  body { margin:0; padding:24px; background:var(--cream); }
  .row { display:flex; gap:18px; }
  .item { text-align:center; }
  .box { width:96px; height:64px; background:var(--gold); border:2px solid var(--deep-brown); }
  .name { font-family:var(--font-body); font-weight:700; font-size:12px; color:var(--charcoal); margin-top:8px; }
  .v { font-family:var(--font-mono); font-size:11px; color:var(--fg2); }
</style></head>
<body>
  <div class="row">
    <div class="item"><div class="box" style="border-radius:4px;"></div><div class="name">Small</div><div class="v">4px · inputs, chips</div></div>
    <div class="item"><div class="box" style="border-radius:8px;"></div><div class="name">Medium</div><div class="v">8px · buttons</div></div>
    <div class="item"><div class="box" style="border-radius:12px;"></div><div class="name">Large</div><div class="v">12px · cards</div></div>
    <div class="item"><div class="box" style="border-radius:16px;"></div><div class="name">XL</div><div class="v">16px · panels</div></div>
    <div class="item"><div class="box" style="border-radius:24px;"></div><div class="name">2XL</div><div class="v">24px · hero</div></div>
    <div class="item"><div class="box" style="border-radius:9999px;"></div><div class="name">Pill</div><div class="v">∞ · badges</div></div>
  </div>
</body></html>
