<!doctype html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="../colors_and_type.css">
<style>
  body { margin:0; padding:24px; background:var(--cream); display:flex; align-items:center; gap:24px; }
  .lockup { display:flex; align-items:center; gap:24px; }
  .item { display:flex; flex-direction:column; align-items:center; gap:10px; }
  .frame { background:#fff; border:1px solid var(--border); border-radius:12px; padding:18px 22px; }
  .dark { background:var(--charcoal); border-color:rgba(253,230,138,0.18); }
  .name { font-family:var(--font-body); font-size:11px; text-transform:uppercase; letter-spacing:0.12em; color:var(--fg3); }
  img { display:block; }
</style></head>
<body>
  <div class="item">
    <div class="frame"><img src="../assets/logo/wordmark.svg" height="44"/></div>
    <div class="name">Wordmark · light</div>
  </div>
  <div class="item">
    <div class="frame dark"><img src="../assets/logo/wordmark-on-dark.svg" height="44"/></div>
    <div class="name">Wordmark · dark</div>
  </div>
  <div class="item">
    <div class="frame"><img src="../assets/logo/logomark.svg" height="60"/></div>
    <div class="name">Logomark</div>
  </div>
  <div class="item">
    <div class="frame"><img src="../assets/logo/seal.svg" height="60"/></div>
    <div class="name">Clean‑catalog seal</div>
  </div>
</body></html>
