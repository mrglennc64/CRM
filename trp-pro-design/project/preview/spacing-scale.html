<!doctype html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="../colors_and_type.css">
<style>
  body { margin:0; padding:24px; background:var(--cream); }
  .row { display:flex; align-items:flex-end; gap:16px; }
  .step { display:flex; flex-direction:column; align-items:center; gap:6px; }
  .bar { background:var(--amber); border-radius:4px; }
  .v { font-family:var(--font-mono); font-size:11px; color:var(--fg2); }
  .name { font-family:var(--font-body); font-weight:600; font-size:11px; color:var(--charcoal); }
</style></head>
<body>
  <div class="row">
    <div class="step"><div class="bar" style="width:4px; height:4px;"></div><div class="name">1</div><div class="v">4px</div></div>
    <div class="step"><div class="bar" style="width:8px; height:8px;"></div><div class="name">2</div><div class="v">8px</div></div>
    <div class="step"><div class="bar" style="width:12px; height:12px;"></div><div class="name">3</div><div class="v">12px</div></div>
    <div class="step"><div class="bar" style="width:16px; height:16px;"></div><div class="name">4</div><div class="v">16px</div></div>
    <div class="step"><div class="bar" style="width:24px; height:24px;"></div><div class="name">5</div><div class="v">24px</div></div>
    <div class="step"><div class="bar" style="width:32px; height:32px;"></div><div class="name">6</div><div class="v">32px</div></div>
    <div class="step"><div class="bar" style="width:48px; height:48px;"></div><div class="name">7</div><div class="v">48px</div></div>
    <div class="step"><div class="bar" style="width:64px; height:64px;"></div><div class="name">8</div><div class="v">64px</div></div>
    <div class="step"><div class="bar" style="width:96px; height:96px;"></div><div class="name">9</div><div class="v">96px</div></div>
  </div>
</body></html>
