<!doctype html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="../colors_and_type.css">
<style>
  body { margin:0; padding:28px; background:var(--cream); }
  .stack { display:flex; flex-direction:column; gap:14px; }
  .row { display:flex; align-items:baseline; gap:16px; }
  .label { font-family:var(--font-body); font-size:11px; text-transform:uppercase; letter-spacing:0.12em; color:var(--fg3); width:110px; flex:none; }
  .display { font-family:var(--font-display); color:var(--charcoal); font-variation-settings:'opsz' 144; }
</style></head>
<body>
  <div class="stack">
    <div class="row"><div class="label">Hero / 84</div><div class="display" style="font-weight:800; font-size:62px; letter-spacing:-0.02em; line-height:0.95;">Get paid.</div></div>
    <div class="row"><div class="label">H1 / 60</div><div class="display" style="font-weight:700; font-size:44px; letter-spacing:-0.02em;">Royalty intelligence</div></div>
    <div class="row"><div class="label">H2 / 44</div><div class="display" style="font-weight:600; font-size:32px;">Fix your catalog</div></div>
  </div>
</body></html>
